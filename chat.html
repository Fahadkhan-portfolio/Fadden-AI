<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaddenAI Command Center</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%230a0a0f'/><rect x='2' y='2' width='96' height='96' rx='26' fill='none' stroke='url(%23borderGrad)' stroke-width='3'/><path d='M30 24 H70 V36 H46 V46 H64 V57 H46 V76 H30 Z' fill='url(%23fGrad)'/><defs><linearGradient id='borderGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%232563eb'/><stop offset='100%25' stop-color='%23a855f7'/></linearGradient><linearGradient id='fGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23ffffff'/><stop offset='100%25' stop-color='%23a855f7'/></linearGradient></defs></svg>" />
  <!-- Futuristic Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* --- Core Reset & Future Baseline --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Space Grotesk', sans-serif;
    }

    body {
      background-color: #030305;
      color: #f0f0f5;
      height: 100vh;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Background Neon Mesh Effect */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48ZyBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiM4Qjk5RkYiIGZpbGwtb3BhY2l0eT0iMC4wNSI+PHBhdGggZD0iTTAgMGg4MHY4MEgwVjB6bTIwIDIwaDIwdjIwSDIWMjB6TTAgMjBoMjB2MjBIMFYyMHoyMCAwaDIwdjIwSDIwVjB6bTIwIDIwaDIwdjIwSDQwVjIwek0wIDQwaDIwdjIwSDBWNDB6bTIwIDIwaDIwdjIwSDIWMjB6TTAgNjBoMjB2MjBIMFY2MHoyMCAwaDIwdjIwSDIwVjYweiIvPjwvZz48L3N2Zz4=');
      z-index: -1;
    }

    /* --- Cyber Sidebar --- */
    .sidebar {
      width: 280px;
      background: rgba(15, 15, 20, 0.6);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
    }

    .sidebar-logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #fff 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 40px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 14px;
      background: rgba(168, 85, 247, 0.1);
      color: #a855f7;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .new-chat-btn:hover {
      background: rgba(168, 85, 247, 0.2);
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
    }

    .sidebar-user {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .user-avatar {
        width: 32px; height: 32px;
        background: #27272a;
        border-radius: 50%;
    }

    /* --- Command Center Chat Container --- */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chat-header {
      padding: 20px 40px;
      background: rgba(10, 10, 15, 0.5);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .status-dot {
        width: 10px; height: 10px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 10px #22c55e;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      scroll-behavior: smooth;
    }
    
    /* Scrollbar Styling */
    .chat-box::-webkit-scrollbar {
        width: 6px;
    }
    .chat-box::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
    }

    /* Havi Message Styling */
    .message {
      max-width: 75%;
      padding: 16px 20px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      position: relative;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-out;
    }

    .user-msg {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    }

    .ai-msg {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.9);
      border-bottom-left-radius: 4px;
    }
    
    /* AI Thinking Pulse */
    .thinking {
        font-style: italic;
        color: rgba(255, 255, 255, 0.5);
        animation: pulse 1.5s infinite;
    }

    /* --- Futuristic Input Area --- */
    .input-area {
      padding: 30px 40px;
      background: rgba(5, 5, 10, 0.8);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .input-wrapper {
        flex: 1;
        position: relative;
    }

    .input-area input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px;
      color: #fff;
      outline: none;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .input-area input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
      background: rgba(255, 255, 255, 0.05);
    }

    .input-area button {
      background: linear-gradient(135deg, #2563eb 0%, #a855f7 100%);
      color: #fff;
      border: none;
      padding: 18px 35px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    .input-area button:hover {
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse {
        0% { opacity: 0.5; }
        50% { opacity: 1; }
        100% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <div class="sidebar-logo">FaddenAI // CMD</div>
      <button class="new-chat-btn">+ Initiate New Session</button>
    </div>
    <div class="sidebar-user">
        <div class="user-avatar"></div>
        <span>Guest Operator</span>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
        <span>Quantum Chat Stream v1.5</span>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: rgba(255,255,255,0.5);">
            Status: <div class="status-dot"></div> SECURE
        </div>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="message ai-msg">System Initialized. I am Fadden AI, your neural interface. Awaiting command parameters.</div>
    </div>
    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Enter command or query (e.g., /generate_code)..." onkeydown="if(event.key === 'Enter') sendMessage()" />
      </div>
      <button onclick="sendMessage()">Execute</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
