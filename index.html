<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>FaddenAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Mobile scrim -->
  <div class="scrim" id="scrim"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">FaddenAI</span>
      </div>
      <button class="icon-btn sidebar-collapse-btn" id="collapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>New chat</span>
    </button>

    <div class="sidebar-section-label"><span>Chats</span></div>
    <nav class="chat-history" id="chatHistory">
      <!-- chat history items injected by JS -->
    </nav>

    <div class="sidebar-bottom">
      <button class="side-link" id="exploreBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.1L12 16.3 5.7 20.7 8 13.6 2 9.2h7.6L12 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Explore</span>
      </button>
      <button class="side-link" id="settingsBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V19a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 13a1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 6.6a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001.55-1V1a2 2 0 114 0v.09a1.7 1.7 0 001.55 1 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V6.6a1.7 1.7 0 001 1.55H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z" stroke="currentColor" stroke-width="1.2"/></svg>
        <span>Settings</span>
      </button>
      <div class="user-chip">
        <span class="user-avatar">F</span>
        <span class="user-name">Fadden</span>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">

    <header class="main-header">
      <div class="header-left">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="model-pill" id="modelPill">
          <span class="model-dot"></span>
          <span id="modelName">FaddenAI &middot; Nova-1</span>
          <svg viewBox="0 0 24 24" fill="none" class="chev"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" class="icon-sun"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" fill="none" class="icon-moon"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 0010.5 10.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <!-- ============ MESSAGES ============ -->
    <main class="chat-window" id="chatWindow">
      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <div class="empty-mark" aria-hidden="true"></div>
          <h1>What are we figuring out today?</h1>
          <p>Ask anything, paste something to fix, or drop an image. FaddenAI keeps it direct.</p>
          <div class="suggestion-row">
            <button class="suggestion-chip" data-prompt="Explain quantum entanglement like I'm smart but not a physicist.">Explain entanglement simply</button>
            <button class="suggestion-chip" data-prompt="Draft a blunt, no-fluff email declining a meeting.">Draft a blunt email</button>
            <button class="suggestion-chip" data-prompt="Give me a 3-day workout split for building strength.">3-day strength split</button>
            <button class="suggestion-chip" data-prompt="Debug this: why would a flexbox child not shrink below its content size?">Why won't flex-item shrink?</button>
          </div>
        </div>
      </div>
    </main>

    <!-- ============ COMPOSER ============ -->
    <div class="composer-wrap">
      <div class="composer" id="composer">

        <div class="plus-menu" id="plusMenu">
          <button class="plus-item" id="uploadImageBtn" data-action="upload">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M21 15l-5-5-9 9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <span>Upload image</span>
          </button>
          <button class="plus-item" id="webSearchBtn" data-action="websearch">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Web search</span>
            <span class="toggle-pill" id="webSearchToggle" data-on="false"></span>
          </button>
          <button class="plus-item" id="imageGenBtn" data-action="imagegen">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 3v4M3 5h4M19 13v4M17 15h4M11 3l1.7 4.6L17 9l-4.3 1.4L11 15l-1.7-4.6L5 9l4.3-1.4L11 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <span>Generate image</span>
          </button>
        </div>

        <input type="file" id="fileInput" accept="image/*" hidden>

        <button class="composer-btn plus-btn" id="plusBtn" aria-label="Add attachment or tool" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <div class="composer-input-area">
          <div class="attachment-preview" id="attachmentPreview"></div>
          <textarea
            id="promptInput"
            class="prompt-input"
            placeholder="Message FaddenAI…"
            rows="1"
            aria-label="Message FaddenAI"
          ></textarea>
        </div>

        <button class="composer-btn mic-btn" id="micBtn" aria-label="Voice input" title="Voice input">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>

        <button class="composer-btn send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="composer-hint">FaddenAI can make mistakes. Check anything that matters.</p>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
